# Opción A del setup local: Mattermost v11.11.1 (imagen oficial) + PostgreSQL.
# Solo para ver la aplicación base; no compila el código de app/.
# Uso: docker compose -f docker-compose.demo.yml up -d  →  http://localhost:8065

services:
  postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser_password
      POSTGRES_DB: mattermost
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 5s
      retries: 10

  mattermost:
    image: mattermost/mattermost-team-edition:11.11.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8065:8065"
    environment:
      TZ: America/Costa_Rica
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mmuser_password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
    volumes:
      - mmdata:/mattermost/data
      - mmconfig:/mattermost/config
      - mmlogs:/mattermost/logs
      - mmplugins:/mattermost/plugins

volumes:
  pgdata:
  mmdata:
  mmconfig:
  mmlogs:
  mmplugins:
