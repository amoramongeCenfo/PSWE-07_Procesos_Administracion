name: "Defecto"
description: "Error encontrado en la mejora, en una revisión de código o en CI."
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: "Qué pasa y qué se esperaba."
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: origen
    attributes:
      label: ¿Dónde se detectó?
      description: "Alimenta la métrica de defectos (docs/06-testing/estrategia-tests.md)."
      options:
        - "Revisión de código (PR)"
        - "CI (GitHub Actions)"
        - "Prueba manual / demo"
        - "Después de integrar a main"
    validations:
      required: true
  - type: input
    id: pr
    attributes:
      label: PR o commit relacionado
      placeholder: "#00 o hash"
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: "Capturas, logs de CI, navegador/SO."
